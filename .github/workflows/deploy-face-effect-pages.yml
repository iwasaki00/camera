name: Deploy camera apps to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - "index.html"
      - "index.xml"
      - "001_browser_camera/**"
      - "002_face_effect/**"
      - "003_henface_maker/**"
      - "004_sudoku_camera/**"
      - "005_ice_magic_ar/**"
      - "006_lightsaber_ar/**"
      - "007_fighting_anime_ar/**"
      - "008_fighting_anime_ar_plus/**"
      - "009_miniature_camera/**"
      - ".github/workflows/deploy-face-effect-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install face_effect dependencies
        working-directory: 002_face_effect
        run: npm install

      - name: Build face_effect
        working-directory: 002_face_effect
        run: npm run build

      - name: Install henface_maker dependencies
        working-directory: 003_henface_maker
        run: npm install

      - name: Build henface_maker
        working-directory: 003_henface_maker
        run: npm run build

      - name: Install ice_magic_ar dependencies
        working-directory: 005_ice_magic_ar
        run: npm install

      - name: Build ice_magic_ar
        working-directory: 005_ice_magic_ar
        run: npm run build

      - name: Assemble Pages site
        shell: bash
        run: |
          mkdir -p site/001_browser_camera
          mkdir -p site/002_face_effect
          mkdir -p site/003_henface_maker
          mkdir -p site/004_sudoku_camera
          mkdir -p site/005_ice_magic_ar
          mkdir -p site/006_lightsaber_ar
          mkdir -p site/007_fighting_anime_ar
          mkdir -p site/008_fighting_anime_ar_plus
          mkdir -p site/009_miniature_camera
          cp index.html site/index.html
          cp index.xml site/index.xml
          cp -r 001_browser_camera/. site/001_browser_camera/
          cp -r 002_face_effect/dist/. site/002_face_effect/
          cp -r 003_henface_maker/dist/. site/003_henface_maker/
          cp -r 004_sudoku_camera/. site/004_sudoku_camera/
          cp -r 005_ice_magic_ar/dist/. site/005_ice_magic_ar/
          cp -r 006_lightsaber_ar/. site/006_lightsaber_ar/
          cp -r 007_fighting_anime_ar/. site/007_fighting_anime_ar/
          cp -r 008_fighting_anime_ar_plus/. site/008_fighting_anime_ar_plus/
          cp -r 009_miniature_camera/. site/009_miniature_camera/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
