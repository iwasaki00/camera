<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ナンプレ カメラ読み取り</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <p class="eyebrow">SUDOKU CAMERA</p>
      <h1>ナンプレをガイドに合わせる</h1>
      <p class="lead">盤面を正面から映し、外枠とマス目がガイドに重なるようにiPhoneを動かしてください。</p>
    </header>

    <section id="cameraSection" class="panel" aria-labelledby="cameraHeading">
      <div class="sectionHeading">
        <div>
          <p class="stepLabel">STEP 1</p>
          <h2 id="cameraHeading">カメラで盤面を合わせる</h2>
        </div>
        <span id="cameraState" class="stateBadge">未起動</span>
      </div>

      <div id="cameraStage" class="cameraStage">
        <video id="cameraPreview" class="preview" playsinline autoplay muted></video>
        <div id="cameraGuide" class="sudokuGuide" aria-hidden="true">
          <div class="gridLines"></div>
        </div>
        <div class="cameraPlaceholder" id="cameraPlaceholder">
          <span>カメラを開始してください</span>
        </div>
      </div>

      <p class="guideInstruction">ナンプレの外枠とマス目を<br>ガイドに合わせてください</p>

      <div class="buttonStack">
        <button id="startCameraButton" class="secondary" type="button">カメラ開始</button>
        <button id="captureButton" class="primary captureButton" type="button" disabled>読み取り</button>
      </div>
    </section>

    <section id="resultSection" class="panel" aria-labelledby="resultHeading" hidden>
      <div class="sectionHeading">
        <div>
          <p class="stepLabel">STEP 2</p>
          <h2 id="resultHeading">切り出し結果を確認</h2>
        </div>
        <span class="stateBadge success">撮影済み</span>
      </div>

      <p class="panelCopy">ガイド内に見えていた盤面が、そのまま正方形に切り出されているか確認してください。</p>

      <div class="resultStage">
        <canvas id="croppedCanvas" aria-label="ガイド内から切り出した画像"></canvas>
        <div class="resultGuide sudokuGuide" aria-hidden="true">
          <div class="gridLines"></div>
        </div>
      </div>

      <button id="retakeButton" class="secondary" type="button">再撮影</button>
    </section>

    <p id="statusMessage" class="status" role="status" aria-live="polite">
      「カメラ開始」を押して、背面カメラの使用を許可してください。
    </p>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
